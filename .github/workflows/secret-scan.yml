# 비밀값 검사 (ADR 0005)
# PR: pull_request_target이라 기준 브랜치의 설정(.gitleaks.toml)과 스크립트로 검사하고, 실패하면 PR에 댓글을 단다.
#     PR 코드는 실행하지 않는다. PR 커밋은 git 객체로만 받아 gitleaks가 글자로 읽는다.
# push: dev/main에 들어온 커밋을 검사한다(댓글 없음).
name: 비밀값 검사

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  scan:
    name: 비밀값 검사
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: 기준 브랜치의 설정과 스크립트 보관
        run: cp .gitleaks.toml .github/scripts/secret_scan.py "$RUNNER_TEMP/"
      - name: gitleaks 설치
        run: |
          cd "$RUNNER_TEMP"
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $f" | sha256sum -c -
          tar -xzf "$f" gitleaks
      - name: 검사 범위
        env:
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ -n "$PR" ]; then
            git fetch -q --no-tags origin "pull/$PR/head:refs/remotes/pr/head"
            head=refs/remotes/pr/head
            range="$BASE..$head"
            git diff --name-status --no-renames "$BASE...$head" > "$RUNNER_TEMP/changed.txt"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            range="$AFTER^!"
            git diff --name-status --no-renames "$AFTER^" "$AFTER" > "$RUNNER_TEMP/changed.txt" || true
          else
            range="$BEFORE..$AFTER"
            git diff --name-status --no-renames "$BEFORE" "$AFTER" > "$RUNNER_TEMP/changed.txt"
          fi
          echo "RANGE=$range" >> "$GITHUB_ENV"
          echo "검사 범위: $range"
      - name: gitleaks
        run: |
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --exit-code 0 \
            --config "$RUNNER_TEMP/.gitleaks.toml" --log-opts="$RANGE" \
            --report-format json --report-path "$RUNNER_TEMP/report.json" .
      - name: 결과와 PR 댓글
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPORT: ${{ runner.temp }}/report.json
        run: |
          python3 "$RUNNER_TEMP/secret_scan.py" --selftest
          CHANGED_FILES="$(cat "$RUNNER_TEMP/changed.txt")" python3 "$RUNNER_TEMP/secret_scan.py"
