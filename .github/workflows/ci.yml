# PR과 dev/main 푸시마다 API, 웹, 앱을 검사한다.
# 비밀값을 쓰지 않는다. 포크 PR도 같은 검사를 받고, 저장소 권한은 읽기만 준다.
# 문서만 바뀌면(docs/, *.md, *.txt) 세 검사를 건너뛴다(ADR 0024). 건너뛴 검사는 브랜치 보호에서 통과로 친다.
# PR 가드레일과 비밀값 검사는 다른 워크플로라 문서 변경에도 그대로 돈다.
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: 바뀐 파일 분류
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 문서만 바뀌었는지 확인
        id: classify
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE" ]; then
            files="$(git diff --name-only "$BASE...$GITHUB_SHA")"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            files="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"
          else
            files=""
          fi
          echo "$files"
          # 목록을 못 구했으면 안전하게 검사한다.
          code=true
          if [ -n "$files" ]; then
            code=false
            while IFS= read -r f; do
              case "$f" in
                docs/*|*.md|*.txt) ;;
                *) code=true ;;
              esac
            done <<< "$files"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "코드 변경: $code"

  api:
    name: API 테스트
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dashpi_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dashpi_test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg 설치
        run: sudo apt-get update -q && sudo apt-get install -yq ffmpeg
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: 패키지 설치
        run: uv sync --frozen
      - name: pytest (느린 YOLO 테스트 제외)
        run: uv run pytest -m 'not model' -q

  web:
    name: 웹 테스트·빌드
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: 패키지 설치
        run: pnpm install --frozen-lockfile
      - name: Vitest
        run: pnpm test
      - name: 빌드
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  app:
    name: 앱 검사
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/app/pnpm-lock.yaml
      - name: 패키지 설치
        run: pnpm install --frozen-lockfile
      - name: 타입 검사
        run: pnpm exec tsc --noEmit
      - name: Jest
        run: pnpm test
